<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#f8f6fc">
<script src="/assets/tema-app.js"></script>
<script src="/assets/idioma-app.js"></script>
<title>Destino | OND</title>
<meta name="description" content="Resenhas de viajantes, nota em OND e artigos do blog sobre o destino. Planeje com o OND vAI.">
<link rel="icon" type="image/svg+xml" href="/assets/ond-symbol.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/tokens/ond-core.css">
<link rel="stylesheet" href="/tokens/ond-b2c.css">
<link rel="stylesheet" href="/assets/explorar-nav.css">
<script src="/assets/edicoes-faixa.js" defer></script>
<link rel="stylesheet" href="/assets/comunidade.css">
<link rel="stylesheet" href="/assets/explorar-escuro.css">
<link rel="stylesheet" href="/assets/avaliacoes.css">
<style>
.hero{position:relative;height:380px;border-radius:28px;overflow:hidden;margin-top:12px;background:var(--deep)}
.hero>img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;view-transition-name:destino-capa}
.hero-in{animation:hero-in .6s cubic-bezier(.22,1,.36,1) .25s both}
.hero.pre .hero-in{animation:none}
@keyframes hero-in{from{opacity:0;transform:translateY(14px)}}
@media (prefers-reduced-motion:reduce){.hero-in{animation:none}}
.hero::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(41,7,86,.05) 30%,rgba(41,7,86,.9))}
.hero-in{position:absolute;left:36px;right:36px;bottom:32px;z-index:1;color:#fff;display:flex;align-items:flex-end;gap:24px;flex-wrap:wrap}
.hero-text{flex:1;min-width:240px}
.country{display:flex;align-items:center;gap:8px;font-size:15px;font-weight:700;opacity:.92}
.country .flag{width:24px;height:17px;border-radius:3px;object-fit:cover}
.hero h1{font-size:56px;font-weight:800;line-height:1;margin:8px 0 12px}
.score{display:flex;align-items:center;gap:12px;font-size:15px;min-height:24px}
.score b{font-size:22px}
.score .ond .off{opacity:.4;filter:brightness(3)}
.hero-actions{display:flex;gap:10px;flex-wrap:wrap}
.interest.on{background:#fff;color:var(--purple);border-color:#fff}
.interest.on svg path{fill:currentColor}
.interest .count{opacity:.8;font-weight:600}
.layout{display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:28px;margin-top:32px;align-items:start}
.tabs{display:flex;gap:28px;border-bottom:1px solid var(--line);margin-bottom:18px}
.tab{position:relative;padding:12px 0;font-weight:700;color:var(--muted)}
.tab.on{color:var(--deep)}
.tab::after{content:"";position:absolute;left:0;right:0;bottom:-1px;height:3px;border-radius:3px 3px 0 0;background:var(--purple);transform:scaleX(0);transform-origin:left;transition:transform .35s cubic-bezier(.22,1,.36,1)}
.tab.on::after{transform:scaleX(1)}
.histogram .row{display:flex;align-items:center;gap:10px;font-size:13px;color:var(--muted);margin-top:8px}
.histogram .row .ond{--size:14px}
.histogram .bar{flex:1;height:8px;border-radius:8px;background:var(--lilac);overflow:hidden}
.histogram .bar i{display:block;height:100%;border-radius:8px;background:var(--purple);width:0;transition:width 1s cubic-bezier(.22,1,.36,1)}
.big-score{display:flex;align-items:center;gap:14px;margin-bottom:6px}
.big-score b{font-size:40px;font-weight:800;line-height:1}
.big-score span{font-size:13px;color:var(--muted)}
.gallery{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.gallery img{width:100%;aspect-ratio:1;object-fit:cover;border-radius:14px;display:block}
.gallery button{padding:0;border:0;background:none;border-radius:14px;overflow:hidden;cursor:pointer}
.gallery button:focus-visible{outline:3px solid #7f11f4;outline-offset:2px}
.write{display:flex;align-items:center;gap:14px;width:100%;text-align:left;background:var(--white);border:1px solid var(--line);border-radius:20px;padding:14px 16px;margin-bottom:14px;transition:border-color .2s}
.write:hover{border-color:color-mix(in srgb,var(--purple) 40%,transparent)}
.write .prompt{flex:1;color:var(--muted)}
.write .onds{--size:20px}
.empty-reviews{background:var(--white);border:1px dashed color-mix(in srgb,var(--purple) 35%,transparent);border-radius:20px;padding:32px;text-align:center}
.empty-reviews .onds{--size:28px;margin-bottom:12px}
.empty-reviews b{display:block;font-size:18px}
.empty-reviews p{color:var(--muted);margin:6px 0 16px}
.catalog-link{display:flex;align-items:center;justify-content:space-between;gap:12px;font-weight:700;color:var(--purple)}
.loading{padding:80px 0;text-align:center;color:var(--muted)}
.when-months{display:grid;grid-template-columns:repeat(6,1fr);gap:6px;margin:4px 0 14px}
.when-months span{height:30px;border-radius:8px;display:grid;place-items:center;font-size:11px;font-weight:800;background:var(--bg);color:var(--muted)}
.when-months span.on{background:var(--purple);color:#fff}
.facts{display:grid;gap:10px}
.facts div{display:flex;justify-content:space-between;gap:12px;font-size:14px}
.facts dt{color:var(--muted)}
.facts dd{font-weight:700;text-align:right}
@media (max-width:900px){
  .hero{height:460px;border-radius:22px;margin:8px -8px 0}
  .hero-in{left:20px;right:20px;bottom:22px}
  .hero h1{font-size:42px}
  .hero-actions{width:100%;display:grid;grid-template-columns:1fr 1fr}
  .hero-actions .btn{min-width:0;padding:0 10px;font-size:14px;gap:6px}
  .hero-actions .btn svg{width:17px;height:17px;flex:none}
  .interest .count{display:none}
  .hero-actions{grid-template-columns:46px 1fr}
  .hero-actions .plan-menu{grid-column:1/-1}
  .hero-actions .plan-menu>summary{width:100%}
  .hero-actions .plan-pop{left:0;right:0;min-width:0}
  .layout{grid-template-columns:1fr;gap:20px;margin-top:20px}
  .side{order:-1}
  .write .onds{display:none}
}
/* aba Guia */
.gd-grupo+.gd-grupo{margin-top:26px}
.gd-head{display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin-bottom:12px}
.gd-head h3{font-size:18px;font-weight:800;color:var(--deep);margin:0}
.gd-head a{font-size:13px;font-weight:700;color:var(--purple);white-space:nowrap}
.gd-lista{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.gd-card{display:flex;gap:12px;padding:10px;border-radius:16px;background:var(--white);border:1px solid var(--line);color:inherit;text-decoration:none;transition:border-color .25s,box-shadow .25s,transform .25s}
.gd-card:hover{border-color:color-mix(in srgb,var(--purple) 40%,transparent);box-shadow:0 10px 26px rgba(41,7,86,.08);transform:translateY(-2px)}
.gd-card img,.gd-sem{flex:none;width:92px;height:92px;border-radius:12px;object-fit:cover}
.gd-sem{display:grid;place-items:center;background:color-mix(in srgb,var(--purple) 8%,transparent);color:var(--purple)}
.gd-sem svg{width:26px;height:26px}
.empty-reviews>svg{display:block;margin:0 auto 10px;color:var(--purple)}
.gd-tx{display:flex;flex-direction:column;gap:4px;min-width:0}
.gd-tx b{font-size:15px;color:var(--deep);line-height:1.25}
.gd-nota{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--muted)}
.gd-nota em{font-style:normal;font-weight:800;color:var(--deep)}
.gd-txt{font-size:13px;line-height:1.45;color:var(--muted);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.gd-por{font-size:12px;color:var(--muted)}
@media (max-width:700px){.gd-lista{grid-template-columns:1fr}}
/* troca de aba suave */
.aba:not([hidden]){animation:aba-in .38s cubic-bezier(.22,1,.36,1) both}
@keyframes aba-in{from{opacity:0;transform:translateY(6px)}}
@media (prefers-reduced-motion:reduce){.aba:not([hidden]){animation:none}}
</style>
</head>
<body>
<div class="nv-content">
  <div class="wrap" id="pagina"><p class="loading">Carregando o destino.</p></div>
<script>
(function () {
  try {
    var saved = JSON.parse(sessionStorage.getItem('ond-destino-pre') || 'null');
    if (!saved || saved.url !== location.pathname + location.search || !saved.image) return;
    var safe = function (text) { return String(text).replace(/[&<>"]/g, function (ch) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[ch]; }); };
    document.getElementById('pagina').innerHTML = '<section class="hero pre"><img src="' + safe(saved.image) + '" alt=""><div class="hero-in"><div class="hero-text"><h1>' + safe(saved.name) + '</h1></div></div></section>';
  } catch (error) {}
})();
</script>
</div>

<div class="scrim"></div>
<div class="sheet" id="resenha" role="dialog" aria-modal="true" aria-labelledby="resenha-titulo">
  <button class="x" data-close aria-label="Fechar"></button>
  <h2 id="resenha-titulo">Resenha</h2>
  <div class="field"><label for="lugar">Qual lugar?</label><input class="input" id="lugar" list="lugares-resenha" autocomplete="off" placeholder="Ex.: um mirante, um restaurante, um passeio"><datalist id="lugares-resenha"></datalist></div>
  <div class="field"><span class="label">Sua nota</span><div class="picker" id="picker"></div><div class="rate-label" id="rate-label"></div></div>
  <div class="field"><label for="texto">Conte como foi</label><textarea class="input" id="texto" placeholder="O que valeu a pena, o que evitar, uma dica pra quem vai."></textarea></div>
  <div class="field"><span class="label">Fotos</span><div class="uploads" id="uploads"><label class="add-photo" aria-label="Adicionar fotos"><span id="icone-camera"></span><input type="file" accept="image/*" multiple hidden id="fotos"></label></div></div>
  <div class="sheet-actions"><button class="btn btn-line" data-close>Cancelar</button><button class="btn btn-primary" id="publicar">Publicar resenha</button></div>
</div>

<script src="/assets/explorar-nav.js" data-page="destino" data-shell="sim"></script>
<script src="/assets/comunidade.js"></script>
<script src="/assets/comunidade-exemplo.js"></script>
<script src="/assets/roteiros-exemplo.js"></script>
<script src="/assets/viagens-criadas.js"></script>
<script src="/assets/avaliacoes-exemplo.js"></script>
<script src="/assets/adicionar-viagem.js"></script>
<script>
(function () {
  var code = new URLSearchParams(location.search).get('cidade') || '';
  var root = document.getElementById('pagina');
  document.querySelector('#resenha .x').innerHTML = ICON.close;
  document.getElementById('icone-camera').outerHTML = ICON.camera;

  var showcaseRequest = fetch('https://ond.agamatec.com/api/showcase/destinations?locale=pt_BR').then(function (response) { return response.json(); }).catch(function () { return []; });
  Promise.all([loadCatalog(), fetch('/assets/busca.json').then(function (response) { return response.json(); }).catch(function () { return []; })])
    .then(function (results) {
      var city = findCity(results[0], code);
      if (!city) { root.innerHTML = '<p class="loading">Não achamos esse destino. <a href="/explorar/#mundo" style="color:var(--purple);font-weight:700">Voltar ao Mundo de destinos</a></p>'; return; }
      render(city, results[1]);
    })
    .catch(function () { root.innerHTML = '<p class="loading">O destino não carregou. Tente de novo em instantes.</p>'; });

  function render(city, index) {
    var key = cityCode(city);
    var earlyCover = root.querySelector('.hero.pre>img');
    document.title = city.name + ' | OND';
    document.getElementById('resenha-titulo').textContent = 'Resenha de ' + city.name;

    var example = OND_EXEMPLO && OND_EXEMPLO.reviews[key] ? OND_EXEMPLO.reviews[key] : [];
    var reviews = OndStore.read('resenhas_' + key, []).map(function (review) { review.author = ME; return review; }).concat(example.map(function (review) {
      var author = OND_EXEMPLO.people[review.by];
      var photos = [];
      for (var shot = 0; shot < (review.photos || 0); shot++) photos.push(city.image);
      return { id: review.id, author: author, when: 'esteve em ' + monthLong(review.month), place: review.place, rate: review.rate, likes: review.likes, text: review.text, photos: photos };
    }));
    var average = reviews.length ? reviews.reduce(function (sum, review) { return sum + review.rate; }, 0) / reviews.length : 0;
    var averageText = average ? (Math.round(average * 10) / 10).toFixed(1).replace('.', ',') : '';
    var countText = reviews.length === 1 ? '1 resenha' : reviews.length + ' resenhas';

    var articles = index.filter(function (item) {
      if (item.k !== 'Blog') return false;
      var title = normalizeText(item.t);
      return title.indexOf(normalizeText(city.name)) >= 0;
    }).slice(0, 3);
    var countryArticles = articles.length ? [] : index.filter(function (item) { return item.k === 'Blog' && normalizeText(item.t).indexOf(normalizeText(city.countryName)) >= 0; }).slice(0, 2);
    var catalogEntry = index.find(function (item) { return item.k === 'Destino' && normalizeText(item.t) === normalizeText('Viaje para ' + city.name); });

    var interested = false;
    var interestBase = OND_EXEMPLO && OND_EXEMPLO.interest[key] || 0;

    root.innerHTML =
      '<section class="hero"><img src="' + escapeHtml(city.image) + '" alt=""><div class="hero-in"><div class="hero-text">' +
      '<div class="country">' + flagHtml(city.iso, 24, 17) + escapeHtml(city.countryName) + '</div><h1>' + escapeHtml(city.name) + '</h1>' +
      '<div class="score">' + (average ? ondsHtml(average, 22) + '<b>' + averageText + '</b><span>' + countText + '</span>' : '<span>Ainda sem resenhas</span>') + '</div></div>' +
      '<div class="hero-actions">' +
      '<button class="btn btn-ghost interest heart-only' + (interested ? ' on' : '') + '" id="interesse" aria-pressed="' + interested + '" aria-label="Salvar nos interesses" title="Salvar nos interesses">' + ICON.heart + '<span class="count" id="interesse-n"></span></button>' +
      '<button class="btn btn-ghost" data-open="resenha">' + ICON.pen + 'Escrever resenha</button>' +
      planMenuHtml(city) + '</div></div></section>' +
      '<div class="layout"><main>' +
      '<div class="tabs"><button class="tab on" data-tab="resenhas">Resenhas</button><button class="tab" data-tab="fotos">Fotos</button><button class="tab" data-tab="guia">Guia</button></div>' +
      '<div id="aba-resenhas" class="aba"></div><div id="aba-fotos" class="aba" hidden></div><div id="aba-guia" class="aba" hidden></div></main>' +
      '<aside class="side">' +
      (reviews.length ? '<div class="card histogram"><h3>Nota dos viajantes</h3><div class="big-score"><b>' + averageText + '</b><div>' + ondsHtml(average, 18) + '<span style="display:block">' + countText + '</span></div></div><div id="barras"></div></div>' : '') +
      (articles.length || countryArticles.length ? '<div class="card"><h3>Do blog do OND</h3>' + articles.concat(countryArticles).map(function (item) {
        return '<a class="article" href="' + item.u + '"><div><b>' + escapeHtml(item.t) + '</b><span>Blog do OND</span></div></a>';
      }).join('') + '</div>' : '') +
      '<div id="quando-ir"></div>' +
      (catalogEntry ? '<div class="card"><a class="catalog-link" href="' + catalogEntry.u + '"><span>Ver o pacote para ' + escapeHtml(city.name) + '</span>' + ICON.next.replace('<svg', '<svg width="20" height="20"') + '</a></div>' : '') +
      '</aside></div>';
    var newCover = root.querySelector('.hero>img');
    if (earlyCover && newCover) newCover.replaceWith(earlyCover);

    showcaseRequest.then(function (showcase) {
      var slug = normalizeText(city.name).replace(/[^a-z0-9]+/g, '-');
      var item = (showcase || []).find(function (entry) { return entry.slug === slug; }) ||
        (showcase || []).find(function (entry) { return normalizeText(entry.title) === normalizeText(city.name); });
      if (!item || !item.bestSeason) return;
      var months = ['JAN', 'FEV', 'MAR', 'ABR', 'MAI', 'JUN', 'JUL', 'AGO', 'SET', 'OUT', 'NOV', 'DEZ'];
      var days = item.minDays ? (item.maxDays && item.maxDays !== item.minDays ? item.minDays + ' a ' + item.maxDays + ' dias' : item.minDays + ' dias') : '';
      document.getElementById('quando-ir').outerHTML = '<div class="card"><h3>Quando ir</h3>' +
        '<div class="when-months">' + months.map(function (label, index) { return '<span class="' + ((item.bestMonths || []).indexOf(index + 1) >= 0 ? 'on' : '') + '">' + label + '</span>'; }).join('') + '</div>' +
        '<dl class="facts"><div><dt>Melhor época</dt><dd>' + escapeHtml(item.bestSeason) + '</dd></div>' +
        (days ? '<div><dt>Dias sugeridos</dt><dd>' + days + '</dd></div>' : '') +
        (item.idealFor ? '<div><dt>Ideal para</dt><dd>' + escapeHtml(item.idealFor) + '</dd></div>' : '') + '</dl></div>';
    });

    function paintInterest() {
      var button = document.getElementById('interesse');
      button.classList.toggle('on', interested);
      button.setAttribute('aria-pressed', String(interested));
      var total = interestBase + (interested ? 1 : 0);
      document.getElementById('interesse-n').textContent = total ? '· ' + total : '';
    }
    paintInterest();
    bindPlanMenus(root);
    document.getElementById('interesse').addEventListener('click', function () {
      if (window.ondLogin) window.ondLogin('interesses');
    });

    if (reviews.length) {
      var buckets = [0, 0, 0, 0, 0, 0];
      reviews.forEach(function (review) { buckets[Math.round(review.rate)]++; });
      document.getElementById('barras').innerHTML = [5, 4, 3, 2, 1].map(function (value) {
        return '<div class="row"><span>' + value + '</span>' + ondSymbol(100) + '<span class="bar"><i data-w="' + Math.round(buckets[value] / reviews.length * 100) + '"></i></span><span>' + buckets[value] + '</span></div>';
      }).join('');
      setTimeout(function () { document.querySelectorAll('.histogram .bar i').forEach(function (bar) { bar.style.width = bar.dataset.w + '%'; }); }, 300);
    }

    function renderReviews() {
      var box = document.getElementById('aba-resenhas');
      var write = '<button class="write" data-open="resenha">' + avatarHtml(ME, 40) + '<span class="prompt">Como foi sua experiência em ' + escapeHtml(city.name) + '?</span>' + ondsHtml(0, 20) + '</button>';
      if (!reviews.length) {
        box.innerHTML = '<div class="empty-reviews">' + ondsHtml(0, 28) + '<b>Ninguém escreveu sobre ' + escapeHtml(city.name) + ' ainda</b><p>Conte um lugar que vale a pena e ajude quem vai depois.</p><button class="btn btn-primary" data-open="resenha">' + ICON.pen + 'Escrever a primeira resenha</button></div>';
        return;
      }
      box.innerHTML = write + '<div class="chips"><button class="chip on">Mais úteis</button><button class="chip">Mais recentes</button><button class="chip">Com fotos</button><button class="chip">De quem eu sigo</button></div><div id="lista"></div>';
      var list = document.getElementById('lista');
      list.innerHTML = grupos().map(grupoHtml).join('');
      bindReviews(list, reviews);
      list.addEventListener('click', function (event) {
        var foto = event.target.closest('[data-lg-foto]');
        if (foto) { ondVerFotos(gruposAtuais[+foto.closest('[data-grupo]').dataset.grupo].fotos, +foto.dataset.lgFoto); return; }
        var shot = event.target.closest('.shots img');
        if (shot) { var fotosDaResenha = Array.prototype.map.call(shot.parentNode.querySelectorAll('img'), function (img) { return img.getAttribute('src'); }); ondVerFotos(fotosDaResenha, fotosDaResenha.indexOf(shot.getAttribute('src'))); return; }
        var mais = event.target.closest('.lg-ver');
        if (mais) {
          var aberto = mais.getAttribute('aria-expanded') !== 'true';
          mais.previousElementSibling.hidden = !aberto;
          mais.setAttribute('aria-expanded', String(aberto));
          mais.textContent = aberto ? 'Mostrar menos' : 'Ver mais resenhas deste lugar';
        }
      });
    }
    /* resenhas do mesmo lugar juntas: um bloco com a nota média e a série de fotos; a mais curtida aparece, as outras em "ver mais" */
    var gruposAtuais = [];
    function grupos() {
      var mapa = {};
      gruposAtuais = [];
      reviews.forEach(function (review) {
        var chave = normalizeText(review.place || '') || ('_' + review.id);
        if (!mapa[chave]) { mapa[chave] = { place: review.place, itens: [], fotos: [] }; gruposAtuais.push(mapa[chave]); }
        mapa[chave].itens.push(review);
      });
      gruposAtuais.forEach(function (grupo) {
        var vistas = {};
        grupo.itens.sort(function (a, b) { return (b.author && b.author.mine ? 1 : 0) - (a.author && a.author.mine ? 1 : 0) || (b.likes || 0) - (a.likes || 0); });
        grupo.itens.forEach(function (review) { (review.photos || []).forEach(function (src) { if (!vistas[src]) { vistas[src] = 1; grupo.fotos.push(src); } }); });
        grupo.media = Math.round(grupo.itens.reduce(function (soma, review) { return soma + review.rate; }, 0) / grupo.itens.length * 10) / 10;
      });
      return gruposAtuais;
    }
    function notaTexto(valor) {
      try { return valor.toLocaleString(window.OndIdioma ? OndIdioma.locale : 'pt-BR', { minimumFractionDigits: 1, maximumFractionDigits: 1 }); } catch (error) { return String(valor).replace('.', ','); }
    }
    function grupoHtml(grupo, indice) {
      if (grupo.itens.length === 1) return reviewHtml(grupo.itens[0]);
      var n = grupo.itens.length;
      return '<section class="lg" data-grupo="' + indice + '">' +
        '<header class="lg-head"><div class="lg-tit">' + ICON.pin + '<h3>' + escapeHtml(grupo.place) + '</h3></div>' +
        '<div class="review-rate">' + ondsHtml(grupo.media, 16) + '<b class="lg-media">' + notaTexto(grupo.media) + '</b><span>' + n + ' resenhas</span></div>' +
        (grupo.fotos.length ? '<div class="lg-fotos">' + grupo.fotos.slice(0, 6).map(function (src, i) {
          return '<button type="button" data-lg-foto="' + i + '" aria-label="Ver foto"><img src="' + escapeHtml(src) + '" alt="" loading="lazy">' + (i === 5 && grupo.fotos.length > 6 ? '<span>+' + (grupo.fotos.length - 6) + '</span>' : '') + '</button>';
        }).join('') + '</div>' : '') + '</header>' +
        reviewHtml(grupo.itens[0]) +
        '<div class="lg-mais" hidden>' + grupo.itens.slice(1).map(reviewHtml).join('') + '</div>' +
        '<button type="button" class="lg-ver" aria-expanded="false">Ver mais resenhas deste lugar</button></section>';
    }
    renderReviews();
    var photos = [];
    reviews.forEach(function (review) { photos = photos.concat(review.photos || []); });
    document.getElementById('lugares-resenha').innerHTML = grupos().filter(function (grupo) { return grupo.place; }).map(function (grupo) { return '<option value="' + escapeHtml(grupo.place) + '">'; }).join('');
    document.getElementById('aba-fotos').addEventListener('click', function (event) {
      var botao = event.target.closest('[data-galeria]');
      if (botao) ondVerFotos(photos, +botao.dataset.galeria);
    });
    document.getElementById('aba-fotos').innerHTML = photos.length ? '<div class="gallery">' + photos.map(function (src, i) { return '<button type="button" data-galeria="' + i + '" aria-label="Ver foto"><img src="' + escapeHtml(src) + '" alt="" loading="lazy"></button>'; }).join('') + '</div>' : '<p class="loading" style="padding:40px 0">As fotos das resenhas aparecem aqui.</p>';
    /* Guia: lugares, passeios, restaurantes e hotéis que os viajantes indicaram nesta cidade (os mesmos do /explorar/avaliacoes/) */
    (function () {
      var box = document.getElementById('aba-guia');
      var gente = (OND_EXEMPLO && OND_EXEMPLO.people) || {};
      var itens = OndStore.read('guia_avaliacoes', []).concat(window.OND_AVALIACOES || []).filter(function (item) { return normalizeText(item.city || '') === normalizeText(city.name); });
      var guiaUrl = '/explorar/avaliacoes/?cidade=' + encodeURIComponent(city.name);
      if (!itens.length) {
        box.innerHTML = '<div class="empty-reviews">' + ICON.pin.replace('<svg', '<svg width="28" height="28"') + '<b>Ninguém indicou lugares em ' + escapeHtml(city.name) + ' ainda</b><p>Conte uma atração, um passeio ou um restaurante que vale a pena.</p><a class="btn btn-primary" href="' + guiaUrl + '">Indicar um lugar</a></div>';
        return;
      }
      var porLugar = {}, lugares = [];
      itens.forEach(function (item) {
        var k = item.cat + '|' + normalizeText(item.title);
        if (!porLugar[k]) { porLugar[k] = { cat: item.cat, title: item.title, itens: [], foto: null }; lugares.push(porLugar[k]); }
        porLugar[k].itens.push(item);
        if (!porLugar[k].foto && item.photo) porLugar[k].foto = item.photo;
      });
      lugares.forEach(function (lugar) { lugar.media = Math.round(lugar.itens.reduce(function (soma, item) { return soma + item.rate; }, 0) / lugar.itens.length * 10) / 10; });
      var GRUPOS = [['lugar', 'Lugares para visitar'], ['passeio', 'Passeios'], ['restaurante', 'Onde comer'], ['hotel', 'Onde ficar']];
      box.innerHTML = GRUPOS.map(function (grupo) {
        var lista = lugares.filter(function (lugar) { return lugar.cat === grupo[0]; }).sort(function (a, b) { return b.media - a.media || b.itens.length - a.itens.length; });
        if (!lista.length) return '';
        return '<section class="gd-grupo"><div class="gd-head"><h3>' + grupo[1] + '</h3><a href="' + guiaUrl + '&aba=' + grupo[0] + '">Ver no Guia</a></div><div class="gd-lista">' + lista.map(function (lugar) {
          var top = lugar.itens[0], autor = gente[top.by];
          return '<a class="gd-card" href="' + guiaUrl + '&aba=' + lugar.cat + '">' +
            (lugar.foto ? '<img src="' + escapeHtml(lugar.foto) + '" alt="" loading="lazy">' : '<span class="gd-sem">' + ICON.pin + '</span>') +
            '<span class="gd-tx"><b>' + escapeHtml(lugar.title) + '</b><span class="gd-nota">' + ondsHtml(lugar.media, 14) + '<em>' + notaTexto(lugar.media) + '</em><small>' + (lugar.itens.length === 1 ? '1 avaliação' : lugar.itens.length + ' avaliações') + '</small></span>' +
            '<span class="gd-txt">' + escapeHtml(top.text || '') + '</span>' + (autor ? '<small class="gd-por">por ' + escapeHtml(autor.name) + '</small>' : '') + '</span></a>';
        }).join('') + '</div></section>';
      }).join('');
    })();
    document.querySelectorAll('.tab').forEach(function (tab) {
      tab.addEventListener('click', function () {
        document.querySelectorAll('.tab').forEach(function (other) { other.classList.toggle('on', other === tab); });
        ['resenhas', 'fotos', 'guia'].forEach(function (nome) { document.getElementById('aba-' + nome).hidden = tab.dataset.tab !== nome; });
      });
    });

    document.addEventListener('click', function (event) { if (event.target.closest('[data-open="resenha"]')) openSheet('resenha'); });

    var chosen = 0, uploaded = [];
    var picker = document.getElementById('picker');
    for (var value = 1; value <= 5; value++) picker.insertAdjacentHTML('beforeend', '<button type="button" data-value="' + value + '" aria-label="' + value + ' de 5">' + ondSymbol(0) + '</button>');
    function paintPicker(value) {
      picker.querySelectorAll('button').forEach(function (button) { button.querySelector('.ond').style.setProperty('--fill', (+button.dataset.value <= value ? 100 : 0) + '%'); });
      document.getElementById('rate-label').textContent = RATE_LABELS[value] || '';
    }
    picker.addEventListener('mouseover', function (event) { var button = event.target.closest('button'); if (button) paintPicker(+button.dataset.value); });
    picker.addEventListener('mouseleave', function () { paintPicker(chosen); });
    picker.addEventListener('click', function (event) {
      var button = event.target.closest('button'); if (!button) return;
      chosen = +button.dataset.value; paintPicker(chosen);
      button.classList.remove('pop'); void button.offsetWidth; button.classList.add('pop');
    });
    document.getElementById('fotos').addEventListener('change', function (event) {
      Array.from(event.target.files).slice(0, 6).forEach(function (file) {
        var reader = new FileReader();
        reader.onload = function () {
          uploaded.push(reader.result);
          document.querySelector('.add-photo').insertAdjacentHTML('beforebegin', '<img src="' + reader.result + '" alt="">');
        };
        reader.readAsDataURL(file);
      });
    });
    document.getElementById('publicar').addEventListener('click', function () {
      var text = document.getElementById('texto').value.trim();
      var place = document.getElementById('lugar').value.trim();
      if (!chosen || !text || !place) { toast('Escreva o lugar, dê a nota e conte como foi'); return; }
      var review = { id: 'eu' + Date.now(), when: 'agora', place: place, rate: chosen, likes: 0, text: text, photos: uploaded.slice(0, 3) };
      var saved = OndStore.read('resenhas_' + key, []); saved.unshift(review); OndStore.write('resenhas_' + key, saved);
      location.reload();
    });
  }
})();
</script>
</body>
</html>
