<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#f8f6fc">
<script src="/assets/tema-app.js"></script>
<script src="/assets/idioma-app.js"></script>
<title>Roteiro | OND</title>
<meta name="description" content="Roteiro de viagem no OND: dia a dia com mapa, reservas, previsão do tempo, checklist e orçamento.">
<link rel="icon" type="image/svg+xml" href="/assets/ond-symbol.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/tokens/ond-core.css">
<link rel="stylesheet" href="/tokens/ond-b2c.css">
<link rel="stylesheet" href="/assets/explorar-nav.css">
<script src="/assets/edicoes-faixa.js" defer></script>
<link rel="stylesheet" href="/assets/comunidade.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<link rel="stylesheet" href="/assets/explorar-escuro.css">
<style>
/* no roteiro a busca de destino do topo não faz sentido */
.nv-top{display:none!important}
:root{--gold-light:#f59811;--gray-card:#d2d2d2;--gray-pill:#e6e6e6;--charcoal:#1e1e1e;--border:#e8e0f0}
.rt-wrap{max-width:1400px;margin:0 auto;padding:12px 28px 90px}
.rt-hero{position:relative;height:220px;border-radius:26px;overflow:hidden;background:var(--deep)}
.rt-hero>img{width:100%;height:100%;object-fit:cover}
.rt-hero .flag{width:22px;height:15px;border-radius:3px;object-fit:cover}
.rt-hero::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(41,7,86,.1) 20%,rgba(41,7,86,.88))}
.rt-hero-in{position:absolute;left:28px;right:28px;bottom:22px;z-index:1;color:#fff;display:flex;align-items:flex-end;gap:18px;flex-wrap:wrap}
.rt-hero h1{font-size:40px;font-weight:800;line-height:1.05}
.rt-hero .rt-meta{display:flex;align-items:center;gap:10px;margin-top:6px;font-weight:600;opacity:.95}
.rt-hero .rt-text{flex:1;min-width:220px}
.rt-people{display:flex;align-items:center;gap:10px;background:rgba(255,255,255,.14);border:1.5px solid rgba(255,255,255,.45);backdrop-filter:blur(6px);border-radius:999px;padding:6px 14px 6px 6px;color:#fff;font-weight:700;font-size:14px;cursor:pointer}
.rt-people .stack{display:flex}
.rt-people .stack .avatar{--av:30px;border:2px solid #fff;margin-left:-8px;font-size:11px}
.rt-people .stack .avatar:first-child{margin-left:0}
/* barra de abas (pílulas do app) */
.rt-bar{position:sticky;top:0;z-index:15;display:flex;align-items:center;gap:8px;padding:14px 0;background:var(--bg);overflow-x:auto;scrollbar-width:none}
.rt-bar::-webkit-scrollbar{display:none}
.rt-pill{flex:none;display:inline-flex;align-items:center;gap:8px;height:42px;padding:0 16px;border-radius:999px;background:var(--gray-pill);color:var(--charcoal);font-weight:700;font-size:14px;border:0;cursor:pointer;transition:background .2s,color .2s}
.rt-pill svg{width:18px;height:18px}
.rt-pill[aria-pressed="true"][data-tab="viagem"]{background:var(--purple);color:#fff}
.rt-pill[aria-pressed="true"][data-tab="orcamento"]{background:var(--neon);color:var(--green)}
.rt-pill[aria-pressed="true"][data-tab="lista"],.rt-pill[aria-pressed="true"][data-tab="dias"]{background:var(--gold-light);color:#290756}
.rt-gap{flex:1}
.rt-more{position:relative}
.rt-more>summary{list-style:none;width:42px;height:42px;border-radius:12px;background:var(--purple);color:#fff;display:grid;place-items:center;cursor:pointer}
.rt-more>summary::-webkit-details-marker{display:none}
.rt-more>summary svg{width:20px;height:20px}
.rt-menu{position:absolute;right:0;top:calc(100% + 8px);z-index:30;min-width:270px;padding:6px;border-radius:14px;background:#fff;box-shadow:0 18px 50px rgba(41,7,86,.22)}
.rt-menu button,.rt-menu a{display:flex;align-items:center;gap:12px;width:100%;height:46px;padding:0 12px;border:0;border-radius:10px;background:none;font:inherit;font-size:13px;font-weight:800;letter-spacing:.02em;color:var(--deep);cursor:pointer;text-align:left}
.rt-menu button:hover,.rt-menu a:hover{background:rgba(127,17,244,.07)}
.rt-menu .tile{width:30px;height:30px;border-radius:9px;display:grid;place-items:center;color:#fff;flex:none}
.rt-menu .tile svg{width:17px;height:17px}
/* conteúdo e mapa lado a lado */
.rt-body{display:grid;grid-template-columns:minmax(0,1fr) minmax(320px,42%);gap:24px;align-items:start}
.rt-body.sem-mapa{grid-template-columns:minmax(0,1fr)}
.rt-body.sem-mapa .rt-map-col{display:none}
.rt-map-col{position:sticky;top:76px}
.rt-map-card{background:var(--white);border:1px solid var(--border);border-radius:22px;padding:10px;box-shadow:0 10px 30px rgba(41,7,86,.06)}
.rt-legend{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;padding:2px 2px 10px}
.rt-legend::-webkit-scrollbar{display:none}
.rt-legend button{flex:none;display:inline-flex;align-items:center;gap:6px;height:32px;padding:0 12px;border-radius:999px;border:1px solid var(--border);background:var(--white);font:inherit;font-size:12px;font-weight:700;color:var(--deep);cursor:pointer}
.rt-legend button i{width:10px;height:10px;border-radius:50%}
.rt-legend button[aria-pressed="true"]{background:var(--deep);border-color:var(--deep);color:#fff}
.rt-map{height:min(620px,calc(100vh - 170px));min-height:380px;border-radius:16px;overflow:hidden;background:#e9ecef}
.rt-map .leaflet-control-attribution{font-size:10px}
.pin{width:28px;height:28px;border-radius:50% 50% 50% 6px;transform:rotate(-45deg);display:grid;place-items:center;color:#fff;font-weight:800;font-size:12px;box-shadow:0 4px 12px rgba(41,7,86,.35);border:2px solid #fff;transition:transform .2s}
.pin span{transform:rotate(45deg)}
.pin.on{transform:rotate(-45deg) scale(1.3)}
.pin.salvo{background:#fff!important;color:var(--purple);border-color:var(--purple)}
/* cards (aba Viagem) */
.rt-card{border-radius:16px;background:var(--gray-card);padding:18px;margin-bottom:16px}
.rt-card h3{font-size:16px;font-weight:800;color:var(--charcoal);margin-bottom:12px;display:flex;align-items:center;gap:10px}
.rt-card h3 .count{margin-left:auto;background:var(--deep);color:#fff;border-radius:999px;padding:2px 10px;font-size:12px}
.rt-summary{background:var(--purple);color:#fff}
.rt-summary h3{color:#fff;font-size:20px;letter-spacing:.02em}
.leg{display:flex;align-items:center;gap:12px;padding:12px;border-radius:12px;background:rgba(255,255,255,.1);margin-top:8px}
.leg .tag{background:var(--neon);color:var(--green);font-size:11px;font-weight:800;border-radius:6px;padding:3px 8px}
.leg svg{width:22px;height:22px;flex:none}
.leg b{display:block;font-size:14px}
.leg small{color:var(--neon);font-weight:700;font-size:12px}
.leg .code{margin-left:auto;font-size:12px;opacity:.85;text-align:right}
.weather{display:flex;gap:10px;overflow-x:auto;scrollbar-width:none}
.weather div{flex:none;min-width:86px;border-radius:12px;background:#fff;padding:10px;text-align:center;font-size:12px;font-weight:700}
.weather svg{width:26px;height:26px;margin:4px auto;color:var(--gold-light)}
.weather b{display:block;font-size:13px}
.row-white{display:flex;align-items:center;gap:12px;background:#fff;border-radius:12px;padding:12px 14px}
.row-white svg{width:22px;height:22px;color:var(--purple);flex:none}
.row-white b{display:block;font-size:14px}
.row-white small{color:var(--muted);font-size:12px}
.minis{display:flex;gap:10px;flex-wrap:wrap}
.mini{width:96px;height:84px;border-radius:12px;background:#9b9b9b;color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;font-size:11px;font-weight:800;text-align:center;padding:6px}
.mini svg{width:24px;height:24px}
.check{display:flex;align-items:center;gap:12px;background:#fff;border-radius:12px;padding:10px 12px;margin-bottom:8px}
.check button.box{width:24px;height:24px;border-radius:50%;border:2px solid #9b9b9b;display:grid;place-items:center;flex:none;background:#fff}
.check.done button.box{background:var(--neon);border-color:var(--neon)}
.check.done button.box::after{content:"";width:9px;height:5px;border-left:2px solid var(--green);border-bottom:2px solid var(--green);transform:rotate(-45deg) translate(1px,-1px)}
.check span{flex:1;font-size:14px}
.check.done span{text-decoration:line-through;color:var(--muted)}
.check .rm{color:var(--muted);font-weight:800;font-size:12px}
.add-row{display:flex;gap:8px;margin-top:6px}
.add-row input{flex:1;height:42px;border-radius:12px;border:0;padding:0 14px;font:inherit}
.notes{width:100%;min-height:110px;border-radius:12px;border:0;padding:14px;font:inherit;font-size:14px;resize:vertical}
/* lista de dias */
.day{background:#fff;border-radius:14px;border:1px solid var(--border);margin-bottom:14px;overflow:hidden}
.day-head{display:flex;align-items:center;gap:10px;padding:14px 16px;cursor:pointer}
.day-dot{width:12px;height:12px;border-radius:50%;flex:none}
.day-head b{font-size:15px;color:var(--charcoal);flex:1;min-width:0;text-wrap:balance}
.day-head .wx{font-size:12px;font-weight:700;color:var(--muted);background:var(--bg);border-radius:999px;padding:3px 9px;white-space:nowrap;flex:none}
@media (max-width:767px){.day-head b .dt{display:block}}
.day-head .toggle{margin-left:auto;width:30px;height:30px;border-radius:9px;display:grid;place-items:center;background:var(--bg);font-weight:800}
.day-tools{display:flex;gap:6px;flex-wrap:wrap;padding:0 16px 10px}
.tool{height:32px;padding:0 12px;border-radius:999px;border:1px solid var(--border);background:#fff;font:inherit;font-size:12px;font-weight:700;color:var(--purple-dark);display:inline-flex;align-items:center;gap:6px;cursor:pointer}
.tool svg{width:15px;height:15px}
.tool:hover{background:var(--lilac)}
.day-body{padding:0 16px 14px}
.day.fechado .day-body,.day.fechado .day-tools{display:none}
.act{display:flex;align-items:center;gap:12px;padding:10px;border-radius:12px;transition:background .2s;cursor:pointer}
.act:hover,.act.on{background:var(--lilac)}
.act .tile{width:44px;height:44px;border-radius:12px;display:grid;place-items:center;flex:none;color:#fff;position:relative}
.act .tile svg{width:22px;height:22px}
.act .num{position:absolute;right:-5px;top:-5px;width:20px;height:20px;border-radius:50%;background:#fff;color:var(--deep);font-size:11px;font-weight:800;display:grid;place-items:center;box-shadow:0 2px 6px rgba(0,0,0,.15)}
.act b{display:block;font-size:14px;font-weight:600;color:var(--charcoal)}
.act .when{font-size:13px;font-weight:700;color:var(--purple-dark)}
.act .note{display:block;font-size:12px;color:var(--muted);margin-top:2px}
.act .booked{font-size:11px;font-weight:800;color:var(--green);background:#e3fbe9;border-radius:6px;padding:2px 7px;margin-left:6px}
.act .txt{flex:1;min-width:0}
.hop{display:flex;align-items:center;gap:8px;margin:2px 0 2px 31px;padding-left:20px;border-left:2px dashed var(--border);min-height:34px;font-size:12px;font-weight:700;color:var(--muted)}
.hop a{color:var(--purple);font-weight:800}
.add-act{display:flex;align-items:center;gap:10px;margin-top:8px;width:100%;height:46px;border-radius:12px;background:#d8c1f1;border:0;font:inherit;font-size:13px;font-weight:800;color:var(--deep);padding:0 12px;cursor:pointer}
.add-act span{width:28px;height:28px;border-radius:8px;background:#fff;display:grid;place-items:center;font-size:18px}
.saved{border-radius:14px;border:1.5px dashed #d9cdef;background:#fbf9ff;padding:14px 16px;margin-bottom:14px}
.saved h4{font-size:15px;font-weight:800;margin-bottom:8px;display:flex;align-items:center;gap:8px}
.saved h4 svg{width:18px;height:18px;color:var(--purple)}
.saved-item{display:flex;align-items:center;gap:10px;padding:8px 0;border-top:1px solid var(--line)}
.saved-item:first-of-type{border-top:0}
.saved-item b{flex:1;font-size:14px;font-weight:600}
.saved-item select{height:34px;border-radius:10px;border:1px solid var(--border);font:inherit;font-size:12px;font-weight:700;color:var(--purple-dark);padding:0 8px;background:#fff}
/* dia a dia detalhado */
.chips{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;padding-bottom:4px;margin-bottom:14px}
.chips button{flex:none;height:38px;padding:0 14px;border-radius:999px;border:0;background:var(--gray-card);font:inherit;font-size:13px;font-weight:700;color:var(--charcoal);cursor:pointer}
.chips button[aria-pressed="true"]{background:var(--gold-light);color:#290756}
.chain{display:flex;align-items:stretch;gap:10px;overflow-x:auto;padding:4px 2px 14px;scroll-snap-type:x mandatory}
.cc{flex:none;width:280px;border-radius:16px;background:#fff;border:1px solid var(--border);overflow:hidden;scroll-snap-align:start;display:flex;flex-direction:column}
.cc-top{padding:16px;text-align:center}
.cc-top .tile{width:56px;height:56px;border-radius:16px;margin:0 auto 10px;display:grid;place-items:center;color:#fff}
.cc-top .tile svg{width:28px;height:28px}
.cc-top b{display:block;font-size:15px;color:var(--charcoal)}
.cc-top .when{font-size:13px;font-weight:700;color:var(--purple-dark)}
.cc-how{margin-top:auto;background:var(--purple-dark);color:#fff;padding:12px}
.cc-how h5{font-size:12px;font-weight:800;letter-spacing:.04em;margin-bottom:8px}
.cc-how p{font-size:12px;opacity:.85;margin-bottom:8px}
.cc-how div{display:grid;gap:6px}
.cc-how a{display:block;height:34px;border-radius:9px;background:var(--purple);color:#fff;font-size:12px;font-weight:800;text-align:center;line-height:34px}
.arrow-sep{flex:none;align-self:center;color:var(--purple);font-weight:800;font-size:20px}
/* orçamento */
.toggle2{display:inline-flex;padding:4px;border-radius:999px;background:#fff;border:1px solid var(--border);margin-bottom:16px}
.toggle2 button{height:36px;padding:0 18px;border-radius:999px;border:0;background:none;font:inherit;font-weight:800;font-size:14px;color:#aeaeae;cursor:pointer}
.toggle2 button[aria-pressed="true"]{background:var(--neon);color:var(--green)}
.total{border-radius:18px;padding:22px;color:#fff;background:linear-gradient(135deg,var(--purple-dark),var(--purple));margin-bottom:16px}
.total small{font-weight:700;opacity:.85}
.total .big{font-size:38px;font-weight:800;line-height:1.1;margin:4px 0 14px}
.split{display:flex;align-items:center;gap:12px;flex-wrap:wrap;background:rgba(255,255,255,.12);border-radius:12px;padding:10px 12px;font-weight:700;font-size:14px}
.split .step{display:flex;align-items:center;gap:6px}
.split .step button{width:30px;height:30px;border-radius:50%;border:0;background:#fff;color:var(--purple);font-weight:800;font-size:16px;cursor:pointer}
.split .pp{margin-left:auto}
.total.real{background:linear-gradient(135deg,var(--green),#0d8a32)}
.cats{display:grid;grid-template-columns:200px 1fr;gap:18px;align-items:center;background:#fff;border:1px solid var(--border);border-radius:16px;padding:18px;margin-bottom:16px}
.cats svg{width:200px;height:200px}
.cat{display:flex;align-items:center;gap:10px;padding:8px 0;border-top:1px solid var(--line);font-size:14px}
.cat:first-child{border-top:0}
.cat i{width:14px;height:14px;border-radius:4px;flex:none}
.cat b{margin-left:auto}
.cat small{color:var(--muted);width:44px;text-align:right}
.balance{background:#fff;border:1px solid var(--border);border-radius:16px;padding:18px}
.balance h4{font-size:15px;font-weight:800;margin-bottom:10px}
.bal{display:flex;align-items:center;gap:10px;padding:8px 0;border-top:1px solid var(--line);font-size:14px}
.bal:first-of-type{border-top:0}
.bal .avatar{--av:32px;font-size:12px}
.bal b{margin-left:auto}
.bal .pos{color:var(--green)}.bal .neg{color:#b42318}
.daily{border-radius:16px;background:#e9fbef;border:1px solid #c6f2d3;padding:16px;margin-bottom:16px;font-weight:700;color:var(--green)}
/* compra */
/* modo viagem: barra roxa no topo, e no celular a barra de baixo do app */
.rt-mode{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:12px;margin:0 -28px 14px;padding:12px 28px;background:var(--deep);color:#fff}
.rt-back{width:38px;height:38px;border-radius:12px;display:grid;place-items:center;background:rgba(255,255,255,.12);color:#fff;flex:none}
.rt-back svg{width:20px;height:20px}
.rt-mode-t{flex:1;min-width:0;display:flex;flex-direction:column;line-height:1.2}
.rt-mode-t b{font-size:16px}
.rt-mode-t small{font-size:13px;opacity:.8;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rt-exit{flex:none;height:36px;padding:0 14px;border-radius:999px;border:1.5px solid rgba(255,255,255,.4);color:#fff;font-size:13px;font-weight:700;display:inline-flex;align-items:center}
.rt-exit:hover{background:rgba(255,255,255,.1)}
.rt-share{flex:none;display:inline-flex;align-items:center;gap:8px;height:36px;padding:0 14px;border-radius:999px;border:0;background:#fff;color:var(--deep);font:inherit;font-size:13px;font-weight:800;cursor:pointer}
.rt-share svg{width:17px;height:17px}
@media (max-width:1023px){.rt-share{width:38px;height:38px;padding:0;justify-content:center;background:rgba(255,255,255,.14);color:#fff}.rt-share span{display:none}}
.rt-bar{top:64px}
.rt-map-col{top:136px}
.rt-tabbar{display:none}
.rt-sheet,.rt-sheet-scrim{display:none}
/* Financeiro (como no app) */
.fin-tabs{display:grid;grid-template-columns:1fr 1fr;margin-bottom:16px;border-bottom:1px solid var(--border)}
.fin-tabs button{height:46px;border:0;background:none;font:inherit;font-size:14px;font-weight:800;letter-spacing:.06em;color:#aeaeae;border-bottom:3px solid transparent;margin-bottom:-1px;cursor:pointer}
.fin-tabs button[aria-pressed="true"]{color:#0a9c3a;border-bottom-color:var(--neon)}
.split{background:rgba(255,255,255,.14);border-radius:14px;padding:12px 14px;display:flex;align-items:center;gap:12px}
.split-t{flex:1;display:flex;flex-direction:column}
.split-t small{font-size:12px;opacity:.85}
.split-t b{font-size:16px}
.split .step button{background:rgba(255,255,255,.2);color:#fff;border-radius:10px}
.ontrip{border-radius:18px;background:#f8f1e9;border:1px solid #f0e2cf;padding:18px;margin-bottom:16px}
.ontrip-h{display:flex;align-items:center;gap:12px;margin-bottom:12px}
.ontrip-h b{display:block;font-size:16px;color:var(--deep)}
.ontrip-h small{color:var(--muted);font-size:13px}
.ontrip-ic{color:var(--gold)}.ontrip-ic svg{width:26px;height:26px}
.ontrip-note{display:flex;align-items:center;gap:8px;background:#fde9d2;border:1px solid #f6d3a8;border-radius:12px;padding:10px 12px;color:#824e0a;font-size:13px;font-weight:700;margin-bottom:8px}
.ontrip-note svg{width:18px;height:18px;flex:none}
.ontrip-row{display:flex;align-items:center;gap:12px;padding:10px 0;border-top:1px solid #efe3d4;font-size:15px;font-weight:600;color:var(--charcoal)}
.ontrip-row:first-of-type{border-top:0}
.ontrip-row-ic{width:38px;height:38px;border-radius:50%;background:#efe1d0;color:#824e0a;display:grid;place-items:center;flex:none}
.ontrip-row-ic svg{width:19px;height:19px}
.ontrip-row b{margin-left:auto;color:#824e0a}
.ontrip .daily{margin:12px 0 0}
@media (max-width:1023px){
  body.modo-viagem .nv-mtop,body.modo-viagem .nv-bottom,body.modo-viagem aside.ond-ed{display:none!important}
  .rt-mode{margin:0 -14px 12px;padding:10px 14px}
  .rt-exit{display:none}
  .rt-bar{display:none}
  .rt-map-col{top:0}
  .rt-hero{height:150px}
  .rt-hero-in .rt-text{display:none}
  .rt-hero-in{left:0;right:0;bottom:-1px;justify-content:center}
  .rt-people{background:var(--bg);border:0;color:var(--deep);padding:4px 14px 4px 4px;transform:translateY(50%)}
  .rt-people .stack .avatar{--av:40px;border-color:var(--bg)}
  .rt-hero{overflow:visible;margin-bottom:34px}
  .rt-hero>img{border-radius:20px}
  .rt-hero::after{border-radius:20px}
  .rt-tabbar{position:fixed;left:0;right:0;bottom:0;z-index:45;display:grid;grid-template-columns:repeat(5,1fr);height:calc(68px + env(safe-area-inset-bottom));padding:6px 6px env(safe-area-inset-bottom);background:var(--white);border-top:1px solid var(--border)}

/* mapa: só o ícone, aceso (mapa ao lado) ou apagado (sem mapa) */
.rt-maptoggle{position:relative;flex:none;width:44px;height:44px;border-radius:12px;display:grid;place-items:center;border:1px solid var(--border);background:var(--white);color:#9b9b9b;cursor:pointer;transition:background .2s,color .2s,border-color .2s}

.rt-map-off{position:absolute;left:50%;top:50%;width:26px;height:2px;border-radius:2px;background:currentColor;transform:translate(-50%,-50%) rotate(-45deg);box-shadow:0 0 0 2px var(--white);transition:opacity .2s}

#rt-main{view-transition-name:rt-main}
.rt-map-col{view-transition-name:rt-mapa}
html.rt-vt::view-transition-group(rt-main),html.rt-vt::view-transition-group(rt-mapa){animation-duration:.42s;animation-timing-function:cubic-bezier(.22,1,.36,1)}
html.rt-vt::view-transition-old(rt-main){animation:rt-sai .22s ease-in both}

html.rt-vt::view-transition-old(root),html.rt-vt::view-transition-new(root){animation-duration:.2s}
@keyframes rt-sai{to{opacity:0;transform:translateY(-6px)}}
@keyframes rt-entra{from{opacity:0;transform:translateY(12px)}}
html.rt-vt::view-transition-old(rt-mapa),html.rt-vt::view-transition-new(rt-mapa){height:100%;object-fit:cover}
/* trilha sonora: cartão de player */
.trilha{display:grid;grid-template-columns:150px minmax(0,1fr);gap:18px;align-items:center;padding:16px;border-radius:20px;background:linear-gradient(135deg,#0d2a17,#085e20 60%,#0a9c3a);color:#fff;box-shadow:0 16px 36px rgba(8,94,32,.25)}

.trilha-capa img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;border-radius:14px;z-index:1;box-shadow:0 10px 24px rgba(0,0,0,.35)}
.trilha-disco{position:absolute;top:8px;right:-18px;width:134px;height:134px;border-radius:50%;background:repeating-radial-gradient(circle,#111 0 2px,#1d1d1d 2px 4px);box-shadow:inset 0 0 0 46px #161616,inset 0 0 0 50px var(--neon);animation:trilha-gira 6s linear infinite}

.trilha-info{min-width:0;display:flex;flex-direction:column;padding-left:22px}

.trilha-estilos i{font-style:normal;font-size:12px;font-weight:700;padding:4px 10px;border-radius:999px;background:rgba(255,255,255,.14)}
.trilha-eq{display:flex;align-items:flex-end;gap:3px;height:18px;margin-bottom:12px}
.trilha-eq b{width:4px;border-radius:2px;background:var(--neon);animation:trilha-eq 1s ease-in-out infinite}
.trilha-eq b:nth-child(2){animation-delay:.15s}.trilha-eq b:nth-child(3){animation-delay:.3s}.trilha-eq b:nth-child(4){animation-delay:.45s}.trilha-eq b:nth-child(5){animation-delay:.6s}.trilha-eq b:nth-child(6){animation-delay:.75s}.trilha-eq b:nth-child(7){animation-delay:.9s}

@media (max-width:1023px){.trilha{grid-template-columns:minmax(0,1fr);gap:14px;padding:14px}.trilha-capa{width:auto;height:140px;margin-right:64px}.trilha-disco{width:128px;height:128px;top:6px;right:-58px;box-shadow:inset 0 0 0 44px #161616,inset 0 0 0 48px var(--neon)}.trilha:hover .trilha-disco{right:-58px}.trilha-info{padding-left:0}.trilha-info>b{font-size:20px}.trilha-estilos{margin:8px 0}}
