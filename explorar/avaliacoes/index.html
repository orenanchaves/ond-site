<body>
<div class="nv-content">
  <div class="wrap av-wrap" id="avaliacoes">
    <header class="av-head">
      <div class="av-head-txt">
        <h1>Guia</h1>
        <p>Hotéis, restaurantes, atrações e passeios avaliados por quem já foi. Gostou de algum? Leve para a sua viagem.</p>
      </div>
      <button type="button" class="btn btn-primary av-avaliar-btn" data-av-avaliar="" data-pede-conta="avaliar"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 20h4L19 9a2.8 2.8 0 0 0-4-4L4 16z"/><path d="m13.5 6.5 4 4"/></svg>Avaliar um lugar</button>
    </header>
    <div class="tabs av-tabs" role="tablist" aria-label="Tipo">
      <button class="tab on" role="tab" aria-selected="true" data-cat="lugar">Atrações</button>
      <button class="tab" role="tab" aria-selected="false" data-cat="passeio">Passeios</button>
      <button class="tab" role="tab" aria-selected="false" data-cat="restaurante">Restaurantes</button>
      <button class="tab" role="tab" aria-selected="false" data-cat="hotel">Hotéis</button>
    </div>
    <div class="av-filter">
      <label class="av-search"><span id="av-lupa"></span><input type="search" id="av-busca" placeholder="Buscar cidade ou lugar" autocomplete="off" aria-label="Buscar cidade ou lugar"></label>
      <div class="chips av-cities" id="av-cidades" aria-label="Cidade"></div>
    </div>
    <div class="av-grid" id="av-lista" aria-live="polite"></div>
  </div>
</div>

<div class="scrim"></div>
