name: Verificar

# Passa o site pelas regras da casa a cada push e a cada pull request.
#
# O modo e catraca (--teto): o que ja estava errado antes continua listado, mas
# erro novo derruba. O teto fica em .verificar-teto.json. Ao limpar um bloco,
# rodar `python verificar.py --gravar-teto` e commitar o arquivo, senao a divida
# velha volta a caber.
#
# Isso tambem cobre o commit automatico do blog-programado.yml, que da push.

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch: {}

jobs:
  verificar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Regras da casa (catraca)
        run: python verificar.py --teto

      - name: Lista completa, para consulta
        if: always()
        run: python verificar.py || true
